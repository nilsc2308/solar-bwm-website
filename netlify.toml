# Netlify: statische Seite ohne Build, Sicherheits-Header, Weiterleitungen der alten WordPress-Adressen
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.openstreetmap.org; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/dienstleistung/*"
  to = "/leistungen.html"
  status = 301
[[redirects]]
  from = "/Produkt/*"
  to = "/produkte.html"
  status = 301
[[redirects]]
  from = "/produkt/*"
  to = "/produkte.html"
  status = 301
[[redirects]]
  from = "/module/*"
  to = "/module.html"
  status = 301
[[redirects]]
  from = "/befestigung/*"
  to = "/befestigung.html"
  status = 301
[[redirects]]
  from = "/elektrokomponenten/*"
  to = "/produkte.html#elektronik"
  status = 301
[[redirects]]
  from = "/wechselrichter/*"
  to = "/wechselrichter.html"
  status = 301
[[redirects]]
  from = "/batterie-steuereinheit/*"
  to = "/speicher.html"
  status = 301
[[redirects]]
  from = "/batterie-speicher/*"
  to = "/speicher.html"
  status = 301
[[redirects]]
  from = "/optimierer/*"
  to = "/energiezaehler.html"
  status = 301
[[redirects]]
  from = "/referenzen/*"
  to = "/referenzen.html"
  status = 301
[[redirects]]
  from = "/kontakt/*"
  to = "/kontakt.html"
  status = 301
[[redirects]]
  from = "/kontakt-bwm/*"
  to = "/kontakt.html"
  status = 301
[[redirects]]
  from = "/impressum/*"
